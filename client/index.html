    <script>
      document.querySelectorAll('script[type="module"]').forEach(function (el) {
        el.addEventListener("error", function () {
          if (!sessionStorage.getItem("gb-reload-once")) {
            sessionStorage.setItem("gb-reload-once", "1");
            location.reload();
          }
        });
      });
    </script>
