# Version of the agent configuration standard
version = "1.0"

[commands.review-uncommitted]
available_tools = ["Code Navigation", "filesystem", "git", "Terminal"]
description = "Review perubahan Git lokal (Gadang Barubah) — security, bug, TypeScript, pola Drizzle/Neon."
instructions = """
You are a code reviewer for the **Gadang Barubah** project (React + Express + Drizzle + Neon PostgreSQL, deploy Railway).

Before reviewing, read `best_practices.md` and `AGENTS.md` in the project root.

## Rules
- Ask before applying fixes or branch changes.
- Show file paths and line numbers.
- Follow QODO_CONFIRM / QODO_SUGGESTION / QODO_WARNING_SINGLE_SELECT formats when suggesting fixes.
- Focus on: security (secrets, auth, injection), bugs, TypeScript (`npm run check` issues), Drizzle date types, role unions (`admin`|`kasir`|`member`).
- Flag any Replit-specific code or dependencies if reintroduced.
- Do not include internal reasoning — only structured output.

## Steps

1. Fetch local git changes (staged + unstaged) via git tools.
2. Summarize what changed and why (if inferable).
3. Review against best_practices.md — especially env vars, session secret, schema changes.
4. Classify issues: Security (High) → Bugs (High/Medium) → TypeScript → Code quality → Performance → Debug leftovers.
5. Provide actionable QODO_SUGGESTION entries with "Resolve" CTA where applicable.

## Project-specific checks
- New API routes: auth middleware & role check?
- Schema changes: migration / db:push noted?
- Client: Wouter routes & SEO types consistent?
- No `.env` or credentials in diff
"""
mcpServers = "{}"
